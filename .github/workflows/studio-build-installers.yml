name: studio-build-installers

on:
  workflow_dispatch:
    inputs:
      windows_x64:
        description: 'Windows x64'
        required: false
        type: boolean
        default: true
      macos_arm64:
        description: 'macOS ARM64 (Apple Silicon)'
        required: false
        type: boolean
        default: false
      macos_x64:
        description: 'macOS x64 (Intel)'
        required: false
        type: boolean
        default: false
      linux_x64:
        description: 'Linux x64'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-build-installers.yml'
      - 'Cargo.*'
  push:
    tags: ['studio-v*']

jobs:
  windows-x64:
    name: Windows x64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_x64 }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
        working-directory: studio
      - run: pnpm tauri icon src-tauri/icons/icon.svg
        working-directory: studio
      - name: Build Kanata sidecars
        run: pnpm sidecars
        working-directory: studio
        env:
          TARGET: x86_64-pc-windows-msvc
      - run: pnpm tauri build --target x86_64-pc-windows-msvc
        working-directory: studio
      - name: Smoke check bundles
        shell: bash
        run: test -d studio/src-tauri/target/x86_64-pc-windows-msvc/release/bundle
      - uses: actions/upload-artifact@v7
        with:
          name: kanata-studio-x86_64-pc-windows-msvc
          path: studio/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**

  macos-arm64:
    name: macOS ARM64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos_arm64 }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
        working-directory: studio
      - run: pnpm tauri icon src-tauri/icons/icon.svg
        working-directory: studio
      - name: Build Kanata sidecars
        run: pnpm sidecars
        working-directory: studio
        env:
          TARGET: aarch64-apple-darwin
      - run: pnpm tauri build --target aarch64-apple-darwin
        working-directory: studio
      - name: Smoke check bundles
        shell: bash
        run: test -d studio/src-tauri/target/aarch64-apple-darwin/release/bundle
      - uses: actions/upload-artifact@v7
        with:
          name: kanata-studio-aarch64-apple-darwin
          path: studio/src-tauri/target/aarch64-apple-darwin/release/bundle/**

  macos-x64:
    name: macOS x64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos_x64 }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
        working-directory: studio
      - run: pnpm tauri icon src-tauri/icons/icon.svg
        working-directory: studio
      - name: Build Kanata sidecars
        run: pnpm sidecars
        working-directory: studio
        env:
          TARGET: x86_64-apple-darwin
      - run: pnpm tauri build --target x86_64-apple-darwin
        working-directory: studio
      - name: Smoke check bundles
        shell: bash
        run: test -d studio/src-tauri/target/x86_64-apple-darwin/release/bundle
      - uses: actions/upload-artifact@v7
        with:
          name: kanata-studio-x86_64-apple-darwin
          path: studio/src-tauri/target/x86_64-apple-darwin/release/bundle/**

  linux-x64:
    name: Linux x64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_x64 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --no-frozen-lockfile
        working-directory: studio
      - run: pnpm tauri icon src-tauri/icons/icon.svg
        working-directory: studio
      - name: Build Kanata sidecars
        run: pnpm sidecars
        working-directory: studio
        env:
          TARGET: x86_64-unknown-linux-gnu
      - run: pnpm tauri build --target x86_64-unknown-linux-gnu
        working-directory: studio
      - name: Smoke check bundles
        shell: bash
        run: test -d studio/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
      - uses: actions/upload-artifact@v7
        with:
          name: kanata-studio-x86_64-unknown-linux-gnu
          path: studio/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**
