name: Windows Manual Build

on:
  workflow_dispatch:
  push:
    branches: ["feat/add-GUI"]
    paths:
      - ".github/workflows/windows-manual-build.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        working-directory: studio
        run: pnpm install --frozen-lockfile
      - name: Build Kanata sidecars
        working-directory: studio
        env:
          TARGET: x86_64-pc-windows-msvc
        run: pnpm sidecars
      - name: Build Kanata Studio
        working-directory: studio
        run: pnpm tauri build
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: kanata-studio-windows-x64
          if-no-files-found: error
          compression-level: 6
          path: |
            target/release/kanata-studio.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
