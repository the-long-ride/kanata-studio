name: Windows Manual Build

on:
  workflow_dispatch:
  pull_request:
    branches: ["feat/add-GUI"]

jobs:
  verify-frontend:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
        working-directory: studio
      - run: pnpm test
        working-directory: studio
      - run: pnpm lint
        working-directory: studio
      - run: pnpm typecheck
        working-directory: studio
      - run: pnpm build
        working-directory: studio
      - run: pnpm lint:lines
        working-directory: studio
      - run: pnpm test:lines
        working-directory: studio
      - run: pnpm test:rules
        working-directory: studio
      - run: pnpm test:config
        working-directory: studio

  verify-rust:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Provide test sidecars
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force studio/src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force studio/src-tauri/binaries/kanata-engine-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType File -Force studio/src-tauri/binaries/kanata-engine-interception-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType File -Force studio/src-tauri/binaries/interception.dll | Out-Null
      - run: cargo fmt --all -- --check
      - run: cargo test -p kanata-studio --lib

  build-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        working-directory: studio
        run: pnpm install --no-frozen-lockfile
      - name: Build Kanata sidecars
        working-directory: studio
        env:
          TARGET: x86_64-pc-windows-msvc
        run: pnpm sidecars
      - name: Build Kanata Studio
        working-directory: studio
        run: pnpm tauri build
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: kanata-studio-windows-x64
          if-no-files-found: error
          compression-level: 6
          path: |
            target/release/kanata-studio.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
