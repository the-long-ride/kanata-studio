name: temp-sidebar-viewport-verify

on:
  pull_request:
    branches: ["tmp/sidebar-viewport-verify-base"]

concurrency:
  group: temp-sidebar-viewport-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
        working-directory: studio
      - run: pnpm test
        working-directory: studio
      - run: pnpm lint
        working-directory: studio
      - run: pnpm typecheck
        working-directory: studio
      - run: pnpm build
        working-directory: studio
      - run: pnpm lint:lines
        working-directory: studio
      - run: pnpm test:lines
        working-directory: studio
      - run: pnpm test:rules
        working-directory: studio
      - run: pnpm test:config
        working-directory: studio

  rust-studio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Provide test sidecars
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force studio/src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force studio/src-tauri/binaries/kanata-engine-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType File -Force studio/src-tauri/binaries/kanata-engine-interception-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType File -Force studio/src-tauri/binaries/interception.dll | Out-Null
      - run: cargo fmt --all -- --check
      - run: cargo test -p kanata-studio --lib
