name: temp-studio-windows-build

on:
  push:
    branches: ["feat/add-GUI"]

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c698a97e701c7a75298b8d06f5545f487c66e731
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
        working-directory: studio
      - run: pnpm test
        working-directory: studio
      - run: pnpm tauri icon src-tauri/icons/icon.svg
        working-directory: studio
      - name: Build Kanata sidecars
        run: pnpm sidecars
        working-directory: studio
        env:
          TARGET: x86_64-pc-windows-msvc
      - run: pnpm tauri build --target x86_64-pc-windows-msvc
        working-directory: studio
      - uses: actions/upload-artifact@v7
        with:
          name: kanata-studio-windows-x64-c698a97
          path: |
            studio/src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
            studio/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
