name: temp-studio-shell-verify

on:
  push:
    branches: ["feat/studio-shell-keyboard-polish"]
  pull_request:
    branches: ["tmp/studio-shell-verify-base"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
        working-directory: studio
      - run: pnpm test
        working-directory: studio
      - run: pnpm lint
        working-directory: studio
      - run: pnpm typecheck
        working-directory: studio
      - run: pnpm build
        working-directory: studio

  rust-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  rust-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Provide test sidecar path
        run: |
          mkdir -p studio/src-tauri/binaries
          touch studio/src-tauri/binaries/kanata-engine-x86_64-unknown-linux-gnu
      - run: cargo test -p kanata-studio --lib
