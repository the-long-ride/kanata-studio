name: temp-studio-shell-verify

on:
  push:
    branches: ["feat/studio-shell-keyboard-polish"]
  pull_request:
    branches: ["tmp/studio-shell-verify-base"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
        working-directory: studio
      - run: pnpm test
        working-directory: studio
      - run: pnpm lint
        working-directory: studio
      - run: pnpm typecheck
        working-directory: studio
      - run: pnpm build
        working-directory: studio

  rust-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
