name: studio-ci

on:
  pull_request:
    paths:
      - 'studio/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'parser/**'
      - 'tcp_protocol/**'
      - '.github/workflows/studio-ci.yml'
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'parser/**'
      - 'tcp_protocol/**'
      - '.github/workflows/studio-ci.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test:lines
      - run: pnpm test:rules
      - run: pnpm lint
      - run: pnpm lint:lines
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all --check
      - run: cargo test -p kanata-studio --all-targets
      - run: cargo clippy -p kanata-studio --all-targets -- -D warnings
